name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (includes the portability guard)
        run: npm test

      - name: Build
        run: npm run build

  migrations:
    name: Migrations reproduce the schema
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: scoutiq
          POSTGRES_PASSWORD: scoutiq
          POSTGRES_DB: scoutiq
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U scoutiq"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://scoutiq:scoutiq@localhost:5432/scoutiq?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # A fresh PostgreSQL instance must be able to recreate the complete
      # ScoutIQ schema from migrations alone.
      - name: Apply migrations to an empty database
        run: npx prisma migrate deploy

      - name: Migrations must match the schema exactly
        run: npx prisma migrate diff --from-schema-datasource prisma/schema.prisma --to-schema-datamodel prisma/schema.prisma --exit-code

      - name: Backup, verify and restore round-trip
        env:
          BACKUP_ROOT: ${{ runner.temp }}/backups
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          npm run db:backup
          npm run db:verify -- --deep

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build application image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
