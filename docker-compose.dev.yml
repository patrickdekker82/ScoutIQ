# Development overrides.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Live reload, and PostgreSQL/Redis published on localhost for psql, DBeaver or
# Prisma Studio. Node, Python, PostgreSQL and Playwright still stay inside
# containers - nothing is installed on the host beyond Docker itself (§6).

services:
  postgres:
    ports:
      - "${POSTGRES_PUBLISH:-127.0.0.1:5432}:5432"

  redis:
    ports:
      - "${REDIS_PUBLISH:-127.0.0.1:6379}:6379"

  migrate:
    build:
      target: deps
    command: ["npx", "prisma", "migrate", "deploy"]
    volumes:
      - .:/app
      - node_modules:/app/node_modules

  web:
    build:
      target: deps
    command: ["npm", "run", "dev"]
    environment:
      NODE_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    user: root
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
      - ${HOST_DATA_ROOT:-./data}:/data

  worker:
    build:
      target: deps
    command: ["npm", "run", "worker"]
    environment:
      NODE_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    user: root
    healthcheck:
      disable: true
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - ${HOST_DATA_ROOT:-./data}:/data

  scheduler:
    build:
      target: deps
    command: ["npm", "run", "scheduler"]
    environment:
      NODE_ENV: development
    user: root
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - ${HOST_DATA_ROOT:-./data}:/data

volumes:
  node_modules:
  next_cache:
